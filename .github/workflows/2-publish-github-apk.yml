name: 2 - Publish GitHub APK

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
      build_run_id:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
      tag_name:
        required: true
        type: string
      version_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      artifact_name:
        description: GitHub APK artifact name from the build run.
        required: true
        type: string
      build_run_id:
        description: GitHub Actions run ID that created the APK artifact.
        required: true
        type: string
      commit_sha:
        description: Commit SHA used by the build run.
        required: true
        type: string
      tag_name:
        description: Release tag, such as v0.1.8.
        required: true
        type: string
      version_name:
        description: Android versionName, such as 0.1.8.
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-github-apk-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  publish-github-release:
    name: 2 - Publish GitHub APK
    runs-on: ubuntu-latest

    steps:
      - name: Download GitHub APK artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.artifact_name }}
          path: build/release
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Validate GitHub APK artifact
        shell: bash
        run: |
          apk_count="$(find build/release -maxdepth 1 -type f -name 'hermes-webui-v*-github.apk' | wc -l | tr -d ' ')"
          if [ "$apk_count" != "1" ]; then
            echo "Expected exactly one GitHub APK artifact, found $apk_count."
            find build/release -maxdepth 1 -type f -print
            exit 1
          fi
          checksum_count="$(find build/release -maxdepth 1 -type f -name 'hermes-webui-v*-github.apk.sha256' | wc -l | tr -d ' ')"
          if [ "$checksum_count" != "1" ]; then
            echo "Expected exactly one APK checksum sidecar, found $checksum_count."
            exit 1
          fi
          (cd build/release && sha256sum --check --strict *.apk.sha256)

      - name: Build release notes body
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          RELEASE_COMMIT: ${{ inputs.commit_sha }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          apk_path="$(find build/release -maxdepth 1 -type f -name 'hermes-webui-v*-github.apk' | head -n 1)"
          test -n "$apk_path" || { echo "No staged GitHub APK found"; exit 1; }
          apk_name="$(basename "$apk_path")"
          apk_sha256="$(sha256sum "$apk_path" | awk '{print $1}')"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.build_run_id }}"

          generated_notes="$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$RELEASE_COMMIT" \
            --jq '.body')"

          release_notes="$(printf '%s\n' "$generated_notes" | sed "1s/^## What's Changed/## What's New/")"
          if ! printf '%s\n' "$release_notes" | grep -q '^## '; then
            release_notes="$(printf "## What's New\n\n%s" "$release_notes")"
          fi

          printf '%s\n' "$release_notes" > build/release/release-notes.md

          {
            echo "## Release diagnostics"
            echo
            echo "- Version: \`$VERSION_NAME\`"
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Commit: \`$RELEASE_COMMIT\`"
            echo "- Artifact: \`$apk_name\`"
            echo "- SHA-256: \`$apk_sha256\`"
            echo "- Workflow run: $run_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub release APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          RELEASE_COMMIT: ${{ inputs.commit_sha }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')"
            test "$existing_commit" = "$RELEASE_COMMIT" || {
              echo "Existing immutable release targets $existing_commit, expected $RELEASE_COMMIT."
              exit 1
            }
            existing_asset_count="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets | length')"
            test "$existing_asset_count" = "2" || {
              echo "Existing immutable release has $existing_asset_count assets; expected exactly the APK and checksum sidecar."
              exit 1
            }
            temp_dir="$(mktemp -d)"
            trap 'rm -rf "$temp_dir"' EXIT
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$temp_dir" \
              --pattern 'hermes-webui-v*-github.apk' \
              --pattern 'hermes-webui-v*-github.apk.sha256'
            existing_apk_count="$(find "$temp_dir" -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')"
            existing_checksum_count="$(find "$temp_dir" -maxdepth 1 -type f -name '*.apk.sha256' | wc -l | tr -d ' ')"
            test "$existing_apk_count" = "1" && test "$existing_checksum_count" = "1" || {
              echo "Existing release does not contain exactly one APK and checksum sidecar."
              exit 1
            }
            (cd "$temp_dir" && sha256sum --check --strict *.apk.sha256)
            local_sha="$(sha256sum build/release/*.apk | awk '{print $1}')"
            existing_sha="$(sha256sum "$temp_dir"/*.apk | awk '{print $1}')"
            test "$local_sha" = "$existing_sha" || {
              echo "Existing immutable APK does not match this build."
              exit 1
            }
            cmp -s build/release/*.apk.sha256 "$temp_dir"/*.apk.sha256 || {
              echo "Existing immutable checksum sidecar does not match this build."
              exit 1
            }
            echo "Existing release target and assets match; leaving the immutable release unchanged."
          else
            gh release create "$RELEASE_TAG" build/release/*.apk build/release/*.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_COMMIT" \
              --title "Hermes WebUI Android $RELEASE_TAG" \
              --notes-file build/release/release-notes.md
          fi
